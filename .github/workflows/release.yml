name: Build & Release Pico Executables

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "ubuntu-22.04"
            target: "x86_64-unknown-linux-gnu"
            os: "linux"
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            os: "macos"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            os: "windows"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Run verification test suite
        run: cargo test

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Compile standalone executable binary
        run: pnpm run build:bin

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: pico-${{ matrix.os }}-executable
          path: |
            target/release/pico
            target/release/pico.exe

      - name: Determine release tag
        id: release_info
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tag=" >> $GITHUB_OUTPUT
            echo "name=Pico (PR Build)" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "name=Pico ${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=v__VERSION__" >> $GITHUB_OUTPUT
            echo "name=Pico v__VERSION__" >> $GITHUB_OUTPUT
          fi

      - name: Build platform packages and installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_info.outputs.tag }}
          releaseName: ${{ steps.release_info.outputs.name }}
          releaseBody: "Automated desktop release of Pico static site studio."
          releaseDraft: true
          prerelease: false
