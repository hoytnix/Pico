name: blog
label: Blog
template: blog.jinja
list_template: blog-list.jinja
fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: date
    label: Date
    type: date
    required: true
  - name: tags
    label: Tags
    type: tags
    required: false
  - name: excerpt
    label: Excerpt
    type: string
    required: false
  - name: hero
    label: Hero image
    type: image
    required: false
  - name: draft
    label: Draft
    type: bool
    required: false
    default: false
  - name: slug
    label: Slug
    type: string
    required: false
